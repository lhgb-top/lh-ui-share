<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="lh-ui-plus">
  <!-- 靛蓝底（--lh-primary #2B4C7C），圆角印章形 / indigo seal -->
  <rect width="200" height="200" rx="36" fill="#2B4C7C"/>
  <!-- 水墨晕染：同色系低透明同心圆，模仿宣纸上的墨晕 / ink wash rings -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  <!-- 朱砂点缀（--lh-danger 朱砂色系）/ cinnabar accent -->
  <circle cx="140" cy="58" r="7" fill="#C0392B"/>
  <!-- 字标：衬线「lh」呼应站点字体栈 / lh wordmark in a serif stack -->
  <text x="100" y="126" text-anchor="middle" font-family="Songti SC, STSong, SimSun, Noto Serif SC, serif"
        font-size="72" font-weight="700" fill="#F5F1E8" letter-spacing="2">lh</text>
</svg>
