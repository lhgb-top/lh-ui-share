name: Release

# 双通道（家族统一发包流程，见 docs/发包流程.md §4.3，与 plus 仓同构）：
#
# ① 自动发版通道——推送到 master 且 changeset 或版本号有变动时自动执行 version + publish；
#   没有待发布的 changeset 时 changesets/action 什么都不做，所以挂在 push 上是安全的。
#   paths 另纳入 .github/workflows/**：发版链自身的修复需要能重跑发版。
#   publish 完成后把 changeset publish 本地创建的 tag（@lh-ui/share@<版本>）推到 origin，
#   触发 ② 留档通道。
# ② 留档通道——推送 @lh-ui/share@x.y.z 格式的 tag（本地 pnpm release:push 或通道①）时，
#   从 npm 拉已发布的原版 tarball 建 GitHub Release（与用户 npm i 装到的内容逐字节一致，
#   不重新构建），再同步 tag 与发行版到 Gitee。
#
# 注意：GitHub Actions 的 tag 过滤里 * 不匹配 /，带作用域的 tag 必须用 **。
# 也可在仓库 Actions 页面手动触发留档（workflow_dispatch 传入已有 tag，用于重跑）。
on:
  push:
    branches: [master]
    paths:
      - '.changeset/**'
      - 'package.json'
      - '.github/workflows/**'
    tags:
      - '@lh-ui/share@**'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重建发行版的已有 tag，如 @lh-ui/share@0.2.0'
        required: true

permissions:
  contents: write # gh release create 需要
  id-token: write
  # changesets/action 把 version 产物推到 changeset-release/master 并开 PR，
  # 缺这个权限会报 "Resource not accessible by integration"，PR 建不出来
  pull-requests: write

jobs:
  # ① 自动发版（push 到 master）
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest

    # dts 构建每个入口起一个 TS program，默认堆会 OOM
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build && pnpm verify:dts && pnpm verify:styles

      - name: Version and publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore(release): 更新版本号'
          title: 'chore(release): 版本发布'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # changeset publish 在本地创建了 @lh-ui/share@<版本> tag，推到 origin 触发留档通道
      - name: 推送发版 tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          TAG="$(git tag --points-at HEAD | grep '^@lh-ui/share@' | head -n 1 || true)"
          if [ -z "$TAG" ]; then echo '未找到 @lh-ui/share@* tag，跳过'; exit 0; fi
          git push origin "$TAG"

  # ② 留档（tag 推送或手动重跑）
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析 tag 并做格式守卫
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^@lh-ui/share@[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag [$TAG] 不是 @lh-ui/share@x.y.z 格式，跳过"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#@lh-ui/share@}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.meta.outputs.skip != 'true'
        with:
          node-version: 24

      # CHANGELOG 只增不减，master 上含全部历史版本段落，两条路径都能提取
      - name: 生成 release notes
        if: steps.meta.outputs.skip != 'true'
        run: node scripts/release-notes.mjs "${{ steps.meta.outputs.version }}" > release-notes.md

      # 新版本刚发布后 npm 注册表可能还没传播开，重试等一会儿
      - name: 拉取已发布的安装包（npm pack）
        if: steps.meta.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            if npm pack "@lh-ui/share@${VERSION}"; then exit 0; fi
            echo "npm 上尚未出现 @lh-ui/share@${VERSION}，${i}/6，30s 后重试"
            sleep 30
          done
          echo "❌ npm 上拉取 @lh-ui/share@${VERSION} 失败，请确认已执行 pnpm release"
          exit 1

      # 补建历史版本时 actions/checkout 是 master 的浅检出（depth 1，不含 tag），
      # 而 gh release create --verify-tag 只认本地 tag，故先把目标 tag 单独拉下来。
      # 发版场景下该 tag 刚推上去，本地已有，fetch 是无副作用的幂等操作。
      - name: 拉取目标 tag 到本地
        if: steps.meta.outputs.skip != 'true'
        run: git fetch origin "refs/tags/${{ steps.meta.outputs.tag }}:refs/tags/${{ steps.meta.outputs.tag }}"

      - name: 创建 GitHub Release 并挂载 .tgz
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TGZ="lh-ui-share-${{ steps.meta.outputs.version }}.tgz"
          # 已存在（重跑场景，例如上次 Gitee 侧失败）只重传资产，不重复创建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" --clobber
          else
            gh release create "$TAG" "$TGZ" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      # Gitee 的 tag 与发行版由本流程统一接管，本地只推 GitHub，避免双写冲突
      - name: 推送 tag 到 Gitee
        if: steps.meta.outputs.skip != 'true'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # 本仓库默认只检出当前分支，补建/重跑场景下本地可能没有该 tag，先单独拉取
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          git remote add gitee "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/lh-ui/lh-ui-share.git" || true
          git push gitee "${TAG}" 2>/dev/null \
            || echo "⚠️ Gitee 上已存在该 tag，跳过推送"

      # Gitee 发行版正文带 GitHub Release 的 tgz 下载链接（Gitee 附件 API 不稳定，不依赖）
      - name: 创建 Gitee 发行版
        if: steps.meta.outputs.skip != 'true'
        continue-on-error: true # GitHub Release 已成功，Gitee 侧失败不阻塞主流程
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          printf '\n\n> 📦 安装包（.tgz）：https://github.com/lhgb-top/lh-ui-share/releases/download/%s/lh-ui-share-%s.tgz\n' \
            "$TAG" "${{ steps.meta.outputs.version }}" >> release-notes.md
          jq -n --arg token "$GITEE_TOKEN" --arg tag "$TAG" --rawfile notes release-notes.md \
            '{access_token:$token, tag_name:$tag, name:$tag, body:$notes, target_commitish:"master"}' \
            | curl -sS -f -X POST "https://gitee.com/api/v5/repos/lh-ui/lh-ui-share/releases" \
                -H "Content-Type: application/json" -d @-
